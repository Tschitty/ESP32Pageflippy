; Zwei Images: Deutsch (esp32_de) und Englisch (esp32_en)
; Two images: German (esp32_de) and English (esp32_en)
[platformio]
src_dir = main
default_envs = esp32_de, esp32_en

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = espidf
board = esp32dev
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = direct

[env:esp32_de]

[env:esp32_en]
build_flags = -DPAGEFLIPPY_LANG_EN
